[package]
name = "librepcb-canvas"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
kurbo = "0.13.1"
librepcb-core = { version = "0.1.0", path = "../librepcb-core" }
peniko = "0.6.1"
rstar = "0.13.0"
slint = { version = "1.18.1", optional = true }
slotmap = "1.1.1"
static_assertions = "1.1.0"
thiserror = "2.0.21"
vello_cpu = { version = "0.2.0", features = ["multithreading", "std", "u8_pipeline"], default-features = false }

# The workspace lints, except that unsafe code is denied instead of
# forbidden: Slint's generated code (the example's `slint!` UI) needs a local
# `#[allow(unsafe_code)]`. The library itself contains no unsafe code.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[features]
slint = ["dep:slint"]

[dev-dependencies]
png = "0.18.1"

[[bench]]
name = "stress"
harness = false

[[example]]
name = "canvas_demo"
required-features = ["slint"]
