[package]
name = "librepcb-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "librepcb-mcp"
path = "src/main.rs"

[features]
default = []
# Streamable HTTP transport (`--http <addr>`).
http = ["rmcp/transport-streamable-http-server", "dep:axum", "tokio/signal", "tokio/net"]

[dependencies]
alphanumeric-sort = "1.5.8"
axum = { version = "0.8.9", optional = true }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
librepcb-core = { version = "0.1.0", path = "../librepcb-core" }
librepcb-editor = { version = "0.1.0", path = "../librepcb-editor" }
librepcb-network = { version = "0.1.0", path = "../librepcb-network" }
librepcb-scene = { version = "0.1.0", path = "../librepcb-scene" }
log = "0.4.34"
parking_lot = "0.12.5"
rmcp = { version = "3.4.1", features = ["server", "transport-io", "macros"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "io-std"] }

[lints]
workspace = true

[dev-dependencies]
rmcp = { version = "3.4.1", features = ["client", "transport-child-process"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process"] }
