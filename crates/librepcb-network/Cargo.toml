[package]
name = "librepcb-network"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
hex = "0.4.3"
librepcb-core = { version = "0.1.0", path = "../librepcb-core" }
librepcb-i18n = { version = "0.1.0", path = "../librepcb-i18n" }
log = "0.4.34"
reqwest = { version = "0.13.5", features = ["stream", "gzip"] }
scopeguard = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "sync", "fs", "io-util", "macros", "process"] }
tokio-util = "0.7.19"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
wiremock = "0.6.5"
