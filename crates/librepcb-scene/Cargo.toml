[package]
name = "librepcb-scene"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
clipper = { version = "0.1.0", path = "../clipper" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
librepcb-canvas = { version = "0.1.0", path = "../librepcb-canvas" }
librepcb-core = { version = "0.1.0", path = "../librepcb-core" }
librepcb-i18n = { version = "0.1.0", path = "../librepcb-i18n" }
log = "0.4.34"
pdf-writer = "0.15.0"
png = "0.18.1"
static_assertions = "1.1.0"
thiserror = "2.0.21"
vello_cpu = { version = "0.2.0", default-features = false, features = ["multithreading", "std", "u8_pipeline"] }

[lints]
workspace = true

[dev-dependencies]
png = "0.18.1"
