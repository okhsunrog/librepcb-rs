[package]
name = "librepcb-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
alphanumeric-sort = "1.5.8"
bitflags = "2.13.2"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clipper = { version = "0.1.0", path = "../clipper" }
csv = "1.4.0"
dunce = "1.0.5"
evalexpr = "13.1.0"
glob = "0.3.4"
html-escape = "0.2.15"
icu_collator = "2.3.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
libm = "0.2.16"
librepcb-i18n = { version = "0.1.0", path = "../librepcb-i18n" }
log = "0.4.34"
md-5 = "0.11.0"
path-clean = "1.0.1"
pathdiff = "0.2.3"
petgraph = "0.8.3"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
spade = "2.15.1"
static_assertions = "1.1.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"
usvg = { version = "0.48.1", default-features = false }
uuid = { version = "1.26.1", features = ["v4"] }
walkdir = "2.5.0"
whoami = "2.1.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.5", features = ["process"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = "0.39.6"

[dev-dependencies]
serde_json = "1.0.151"
