[package]
name = "librepcb-app-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The compiled Slint UI of the LibrePCB application (ported from upstream)"

# The workspace lints, except that unsafe code is denied instead of
# forbidden: Slint's generated code needs a local `#[allow(unsafe_code)]`.
# The crate itself contains no unsafe code.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
slint = "1.18.1"

[build-dependencies]
librepcb-i18n = { version = "0.1.0", path = "../../librepcb-i18n" }
slint-build = "1.18.1"
