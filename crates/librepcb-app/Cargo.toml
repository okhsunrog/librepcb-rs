[package]
name = "librepcb-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "LibrePCB graphical application (Slint UI)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "librepcb"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }
env_logger = "0.11.11"
librepcb-app-ui = { version = "0.1.0", path = "ui" }
librepcb-canvas = { version = "0.1.0", path = "../librepcb-canvas", features = ["slint"] }
librepcb-core = { version = "0.1.0", path = "../librepcb-core" }
librepcb-editor = { version = "0.1.0", path = "../librepcb-editor" }
librepcb-i18n = { version = "0.1.0", path = "../librepcb-i18n" }
librepcb-scene = { version = "0.1.0", path = "../librepcb-scene" }
log = "0.4.34"
open = "5.4.4"
parking_lot = "0.12.5"
png = "0.18.1"
rfd = "0.17.2"
slint = "1.18.1"
thiserror = "2.0.21"

[features]
# Slint's embedded MCP server for driving the UI from agents (see the crate
# documentation, "Debugging the UI with agents"). Equivalent to
# `--features slint/mcp`; never enable it by default.
ui-debug-mcp = ["slint/mcp"]

[dev-dependencies]
tempfile = "3.27.0"
